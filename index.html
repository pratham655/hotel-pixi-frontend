<!DOCTYPE html>
<html>
<head>
  <title>Hotel Pixi</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

  <h1>Hotel Pixi</h1>
  <p>Comfort. Calm. Class.</p>

  <!-- ROOM BOOKING -->
  <h2>Book a Room</h2>

  <input id="name" placeholder="Your Name">
  <input id="email" placeholder="Email Address">

  <select id="room" onchange="calculateRoomPrice()">
    <option value="">Select Room Type</option>
    <option value="Single">Single Room</option>
    <option value="Deluxe">Deluxe Room</option>
    <option value="Suite">Suite</option>
  </select>

  <input id="date" type="date">

  <p>Room Price: ₹<span id="roomPrice">0</span></p>

  <button onclick="bookRoom()">Book Room</button>
  <p id="result"></p>

  <hr>

  <!-- FOOD ORDER -->
  <h2>Restaurant Menu</h2>

  <select id="food" onchange="calculateFoodPrice()">
    <option value="">Select Food</option>
    <option value="Pizza">Pizza (Italian)</option>
    <option value="Burger">Burger (American)</option>
    <option value="Pasta">Pasta (Italian)</option>
    <option value="Biryani">Biryani (Asian)</option>
    <option value="Grilled Chicken">Grilled Chicken (Continental)</option>
  </select>

  <input id="quantity" type="number" placeholder="Quantity" oninput="calculateFoodPrice()">

  <p>Food Total: ₹<span id="foodPrice">0</span></p>

  <button onclick="orderFood()">Order Food</button>
  <p id="foodResult"></p>

  <hr>

  <!-- PAYMENT -->
  <h2>Payment</h2>

  <select id="paymentMethod">
    <option value="">Select Payment Method</option>
    <option value="UPI">UPI</option>
    <option value="Card">Card</option>
    <option value="Cash">Cash</option>
  </select>

  <button onclick="pay()">Pay</button>
  <p id="payResult"></p>

</div>

<script src="script.js"></script>
</body>
</html>
