<!DOCTYPE html>
<html>
<head>
  <title>Hotel Pixi</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

  <h1>Hotel Pixi</h1>
  <p>Comfort. Calm. Class.</p>

  <!-- ROOM BOOKING -->
  <h2>Book a Room</h2>
  <input id="name" placeholder="Your Name">
  <input id="email" placeholder="Email Address">

  <select id="room">
    <option value="">Select Room</option>
    <option value="Single">Single Room</option>
    <option value="Deluxe">Deluxe Room</option>
    <option value="Suite">Suite</option>
  </select>

  <input id="date" type="date">
  <button onclick="bookRoom()">Book Room</button>
  <p id="result"></p>

  <hr>

  <!-- FOOD ORDER -->
  <h2>Restaurant Menu</h2>

  <select id="food">
    <option value="">Select Food</option>
    <option value="Pizza">Pizza (Italian)</option>
    <option value="Pasta">Pasta (Italian)</option>
    <option value="Grilled Chicken">Grilled Chicken (Continental)</option>
    <option value="Salad">Salad (Continental)</option>
    <option value="Fried Rice">Fried Rice (Asian)</option>
    <option value="Noodles">Noodles (Asian)</option>
    <option value="Tacos">Tacos (Mexican)</option>
    <option value="Burrito">Burrito (Mexican)</option>
  </select>

  <input id="quantity" type="number" placeholder="Quantity">
  <p>Total Price ₹<span id="price">0</span></p>

  <button onclick="orderFood()">Order Food</button>
  <p id="foodResult"></p>

  <button onclick="payNow()">Pay</button>
  <p id="payMsg"></p>

</div>

<script src="script.js"></script>
</body>
</html>
